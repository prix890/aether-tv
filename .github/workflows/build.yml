name: Build Aether TV

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build release APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Keep APK as a downloadable artifact
        uses: actions/upload-artifact@v4
        with:
          name: AetherTV-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk AetherTV.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest AetherTV.apk \
            --title "Aether TV (latest build)" \
            --notes "Latest automated build." \
            --target "${{ github.sha }}"
